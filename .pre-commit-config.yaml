repos:
  - repo: local
    hooks:
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: make typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: format
        name: make format
        entry: make format
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: no-co-authored-by
        name: forbid Co-Authored-By trailer
        entry: bash -c '! grep -iE "^Co-Author[^:]*:" "$1" >/dev/null'
        language: system
        args: ["<COMMIT_MSG_FILE>"]
        stages: [commit-msg]
        always_run: true
        pass_filenames: false
