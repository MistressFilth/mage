name: Checks

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  matrix-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on the Windows runner, so the same make targets work
        # on all three platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: make check
      - run: make test

  # The aggregating gate. Branch protection requires a status context
  # named exactly "check"; a matrix job reports as "check (<os>)" and
  # would never satisfy it. Keeping the required context on a separate
  # single job means the platform list can change without touching
  # branch protection.
  check:
    needs: matrix-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every platform succeeded
        run: |
          result='${{ needs.matrix-check.result }}'
          echo "matrix-check result: $result"
          test "$result" = "success"
