[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mage"
version = "0.7.1"
description = "mage execution engine: spec-driven development pipeline"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.6",
    "pydantic-ai>=0.0.30",
    "pydantic-graph>=0.0.30",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "pydantic-settings[toml]>=2.14.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ty==0.0.65",
    "ruff>=0.4",
]

[project.scripts]
mage = "mage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.1",
]
