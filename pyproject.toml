[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mage"
version = "1.0.0"
description = "mage execution engine: spec-driven development pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-ai>=0.0.30",
    "pydantic-graph>=0.0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ty==0.0.65",
    "ruff>=0.4",
]

[project.scripts]
mage = "mage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
